name: Build target pages

on:
  schedule:
    - cron: '41 4 * * 1'      # weekly, Monday 04:41 UTC
  workflow_dispatch:
    inputs:
      genes:
        description: 'Space-separated gene symbols to rebuild (blank = all)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate pages from ChEMBL
        env:
          SITE_BASE: https://yangsong0626.github.io/chemva
        run: node tools/build-pages.mjs ${{ github.event.inputs.genes }}

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add t targets.html sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Rebuild target pages from ChEMBL ($(date -u +%F))"
            git push
          fi
